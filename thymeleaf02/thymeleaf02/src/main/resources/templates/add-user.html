<!DOCTYPE html>
<html xmlns:th = "http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
<h2>Add User</h2>
  
  <form action="/save" method="post" th:object = "${user}">
  
   <input type = "hidden" th:field = "*{uid}"/>
   UserName<input type = "text" th:field = "*{username}"/><br>
   Password<input type = "password" th:field = "*{password}"/><br>   
   Email<input type = "text" th:field = "*{email}"/><br>
   Phone<input type = "text" th:field = "*{phone}"/><br>
  
  <button type="submit">Save</button>
  
  </form>
  
</body>
</html>
